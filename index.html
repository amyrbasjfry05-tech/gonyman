
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GonyMan | سامانه جامع گونی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="page1Header">
        <div class="logo">GONY<span>MAN</span></div>
        <div class="system-name">سامانه جامع ثبت درخواست گونی</div>
    </header>

    <main class="container" id="page1">
        <div class="badge">سامانه رسمی پذیرش درخواست</div>

        <h1>به سامانه GonyMan خوش آمدید</h1>

        <p class="description">
            جهت آغاز فرآیند ثبت درخواست، لطفاً به سؤال زیر پاسخ دهید.
        </p>

        <div class="question-box">
            <h2>سطلی فنی یا نه؟</h2>

            <div class="buttons">
                <button id="yesBtn">بله، هستم</button>
                <button id="noBtn">خیر، نیستم</button>
            </div>
        </div>

        <p class="footer-note">
            کلیه حقوق این سامانه محفوظ است.
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
